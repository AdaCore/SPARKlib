variables:
  GIT_CLONE_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true") || $CI_PIPELINE_SOURCE == "schedule"
      when: always
    # Run on pipelines created by selecting "Run pipeline" in the GitLab UI,
    # from the project’s "Build > Pipelines" section.
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

include:
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/check-issue@~latest
    inputs:
      stage: check
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/pre-commit@~latest
    inputs:
      stage: check
  - project: eng/gitlab-templates
    file: /ci-templates-shared/insteadOf.yml
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: check

stages:
  - check
  - build


pre-commit:
  interruptible: true
  before_script:
    - generic_anod_ci $GENERIC_ANOD_CI_OPTIONS
    - cat /tmp/ci_env.sh
    - . /tmp/ci_env.sh
    - cd $ANOD_DEFAULT_SANDBOX_DIR
    - SPECPATH=$(anod tune 2>&1 | awk '/Path:/ {p=$NF} /Specs:/ {if ($NF == "anod)") print p "/vcs/anod-auto"; else print $NF}')
    - echo $SPECPATH
    - GNATFORMAT_DATE=`sed -n 's/.*gnatformat_version = "\(.*\)".*/\1/p' $SPECPATH/sparkdev.anod`
    - echo $GNATFORMAT_DATE
    - anod install gnat --latest
    - anod install gnatformat -Qdate=$GNATFORMAT_DATE
    - eval $(anod printenv gnat -Qdate)
    - eval $(anod printenv gnatformat -Qdate=$GNATFORMAT_DATE)
    - gnatformat --version
    - cd $CI_PROJECT_DIR

# Run the selected commit message check(s) against every commit in the merge
# request. "commit-msg" checks are *not* exercised by the regular "pre-commit"
# job, which only runs the default-stage hooks over the file diff.
commit-level-checks:
  interruptible: true
  services:
     - image:pe-base
  stage: check
  needs: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - !reference [.insteadOfPython]
    - python -m pip install pre-commit
    - |
      set -eu

      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:?CI_MERGE_REQUEST_DIFF_BASE_SHA is not set}"
      head="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA:?CI_COMMIT_SHA is not set}}"
      commits="$(git rev-list --reverse "${base}..${head}")"

      for commit in $commits; do
        echo "Checking commit message for $commit"
        git log -1 --format=%B "$commit" > .gitlab_commit_msg

        pre-commit run check-attribution \
            --hook-stage commit-msg \
            --commit-msg-filename .gitlab_commit_msg
      done

coverage:
  stage: build
  services:
     - image:pe-base
     - cpu:8
  needs: []
  interruptible: true
  script:
    # script to load helper functions for log sections
    - source scripts/ci_predef.sh
    - generic_anod_ci $GENERIC_ANOD_CI_OPTIONS
    - cat /tmp/ci_env.sh
    - . /tmp/ci_env.sh
    - section_start "anod_setup" "Setup anod packages"
    - cd $ANOD_DEFAULT_SANDBOX_DIR
    - for i in gnat spark2014 gnatcov ; do anod install $i --latest ; done
    - for i in gnat spark2014 gnatcov ; do eval $(anod printenv $i) ; done
    - section_end "anod_setup"
    - section_start "project_setup" "Setup testsuite and locations"
    - |
      if [ -d /tmp/checkouts/spark2014 ]; then
        export SPARK2014_DIR=/tmp/checkouts/spark2014
      else
        export SPARK2014_DIR=/tmp/spark2014
        rm -rf $SPARK2014_DIR
        git clone $GIT_CLONE_BASE/eng/spark/spark2014 --depth 1 $SPARK2014_DIR
      fi
    - cd $SPARK2014_DIR
    - rm -rf include testsuite/gnatprove/sparklib
    - ln -s $CI_PROJECT_DIR include
    - ln -s $CI_PROJECT_DIR/tests testsuite/gnatprove/sparklib
    - rm -rf $CI_PROJECT_DIR/.sparklib-install
    - python3 $CI_PROJECT_DIR/scripts/sparklib_tree.py install-tree
        --dest $CI_PROJECT_DIR/.sparklib-install --link
    - export SPARKLIB_PROJECT_PATH=$CI_PROJECT_DIR/.sparklib-install
    - cd testsuite/gnatprove
    - section_end "project_setup"
    - python sparklib-coverage.py
    - rm -rf $CI_PROJECT_DIR/sparklib-report
    - cp -a sparklib-report $CI_PROJECT_DIR/
    - section_start "coverage_report" "Generate Coverage HTML report"
    # Coverage HTML report
    - export HTMLTARGETDIR=$CI_COMMIT_BRANCH
    - if [[ $CI_PIPELINE_SOURCE == "merge_request_event" ]]; then export HTMLTARGETDIR=MRs/$CI_MERGE_REQUEST_IID ; fi
    - publish-pages $CI_PROJECT_DIR/sparklib-report --target-subdir $HTMLTARGETDIR --expires 30
    - section_end "coverage_report"
