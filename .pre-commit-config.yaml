repos:
  - repo: local
    hooks:
    - id: check-ada-style
      name: Style checking for Ada files
      entry: make check
      language: system
      always_run: true
      pass_filenames: false
    - id: check-opt-syntax
      name: Check opt file syntax
      files: '\.opt$'
      language: system
      entry: e3-opt-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-json
        exclude: ^\.vscode/
    -   id: check-merge-conflict
    -   id: check-symlinks
    # Generic YAML validation for all YAML files except GitLab CI.
    # GitLab CI supports custom YAML tags such as !reference, which generic
    # YAML loaders used do not understand in strict mode.
    -   id: check-yaml
        name: check-yaml-strict
        exclude: ^\.gitlab-ci\.yml$
    # GitLab CI YAML validation.
    # --unsafe checks syntax without constructing the YAML object model,
    # allowing GitLab-specific tags such as !reference.
    -   id: check-yaml
        name: check-gitlab-ci-yaml
        files: ^\.gitlab-ci\.yml$
        args: [--unsafe]
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
    -   id: trailing-whitespace
  - repo: git-adacore:eng/spark/support
    rev: "v1.2.0"
    hooks:
    -   id: check-attribution
    -   id: check-empty-testoutopt
    -   id: check-testsuite-markers
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    - id: flake8
      additional_dependencies:
        - flake8-bugbear
  - repo: https://github.com/ambv/black
    rev: 25.1.0
    hooks:
    - id: black
  - repo: local
    hooks:
      - id: check-gnatformat-gnatprove
        name: Check for Ada formatting
        files: ^src/.*\.ad(b|s)$
        env:
          SPARKLIB_INSTALLED: 'False'
        language: system
        entry: gnatformat -P sparklib_internal.gpr
